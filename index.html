<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #0f0f0f; color: #fff; }
    h1 { text-align: center; }
    textarea, input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #ff4d4d; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    button:hover { background: #ff3333; }
    #result { margin-top: 20px; padding: 20px; background: #1a1a1a; border-radius: 12px; display: none; }
    .vibe { font-size: 48px; font-weight: bold; color: #ff4d4d; }
  </style>
</head>
<body>
  <h1>echo</h1>
  <p style="text-align:center;color:#888">drop a link or text → get a clean summary + vibe score</p>
  
  <input type="text" id="input" placeholder="Paste a link or type text here...">
  <button onclick="summarize()">Summarize</button>
  
  <div id="result">
    <h3>Summary</h3>
    <p id="summary-text"></p>
    <div style="text-align:center;margin-top:20px">
      <div class="vibe" id="vibe-score"></div>
      <div style="color:#888">vibe score</div>
    </div>
    <button onclick="copyResult()" style="margin-top:20px;background:#333">Copy to share</button>
  </div>

  <script>
    function summarize() {
      const input = document.getElementById('input').value.trim();
      if (!input) return alert('Drop something first');
      
      // Fake but realistic summarization
      let summary = input.length > 200 
        ? input.substring(0, 180) + '...' 
        : input;
      
      // Simple vibe score based on length + keywords
      let score = Math.min(100, Math.floor(input.length / 3) + 20);
      if (input.toLowerCase().includes('fire') || input.toLowerCase().includes('lit')) score = Math.min(100, score + 15);
      if (input.toLowerCase().includes('mid') || input.toLowerCase().includes('boring')) score = Math.max(10, score - 20);
      
      document.getElementById('summary-text').innerText = summary;
      document.getElementById('vibe-score').innerText = score;
      document.getElementById('result').style.display = 'block';
    }
    
    function copyResult() {
      const summary = document.getElementById('summary-text').innerText;
      const score = document.getElementById('vibe-score').innerText;
      const text = `Echo summary: ${summary}\nVibe score: ${score}/100`;
      navigator.clipboard.writeText(text).then(() => alert('Copied! Go share it.'));
    }
  </script>
</body>
</html>
